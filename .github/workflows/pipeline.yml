name: pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all, or comma list: smoke,prices,filings,docs,screener,symbols,transcripts,build,research"
        default: "all"
      tickers:
        description: "Portfolio tickers override (comma list, blank = all)"
        default: ""
      research:
        description: "Research tickers override (comma list, blank = research set)"
        default: ""
      days:
        description: "Filings look-back in days"
        default: "30"
  schedule:
    - cron: "45 11 * * 1-5"   # 17:15 IST, after market close
    - cron: "15 3 * * *"      # 08:45 IST daily, overnight filings

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"          # print progress live in the Actions log
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      - name: Decide stages
        id: s
        run: |
          S="${{ github.event.inputs.stage || 'all' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # evening run also refreshes transcripts; research rebuilds only companies with a new one
            if [ "$(date -u +%H)" -ge 10 ]; then S="prices,filings,screener,transcripts,build,research"; else S="prices,filings,build"; fi
          fi
          if [ "$S" = "all" ]; then S="smoke,prices,filings,screener,symbols,transcripts,build,research"; fi
          has() { case ",$S," in *",$1,"*) echo true;; *) echo false;; esac; }
          FETCH=$(echo "$S" | tr ',' '\n' | grep -vE '^(build|research)$' | paste -sd, -)
          echo "fetch=$FETCH" >> $GITHUB_OUTPUT
          echo "build=$(has build)" >> $GITHUB_OUTPUT
          echo "research=$(has research)" >> $GITHUB_OUTPUT

      - name: 1 · Fetch (raw data)
        if: steps.s.outputs.fetch != ''
        continue-on-error: true
        run: python pipeline/run.py --stage "${{ steps.s.outputs.fetch }}" --tickers "${{ github.event.inputs.tickers }}" --research "${{ github.event.inputs.research }}" --days "${{ github.event.inputs.days || '30' }}"

      - name: 2 · Build feed (filings → events, cards)
        if: steps.s.outputs.build == 'true'
        continue-on-error: true
        run: python pipeline/run.py --stage build --tickers "${{ github.event.inputs.tickers }}" --days "${{ github.event.inputs.days || '30' }}"

      - name: Commit feed
        if: always()
        run: pipeline/commit.sh "fetch+build"

      - name: 3 · Research (promise ledgers)
        if: steps.s.outputs.research == 'true'
        continue-on-error: true
        run: python pipeline/run.py --stage research --research "${{ github.event.inputs.research }}"

      - name: Commit research
        if: always()
        run: pipeline/commit.sh "research"
